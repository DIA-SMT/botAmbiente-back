server {
    listen 80;
    server_name servidoria.smt.gob.ar;

    # Bloque para el bot de Ambiente (Proyecto actual)
    location /ambiente/ {
        proxy_pass http://localhost:3001/; # Notar el '/' al final
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Bloque para el bot de Turismo (Ya existente)
    location /turismo/ {
        proxy_pass http://localhost:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # ... resto de la configuración (SSL, etc.)
}
